services:
  - type: web
    name: monali-otp
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /ping.php
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: otp
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSL
        value: "1"
